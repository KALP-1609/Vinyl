name: Build & Release

on:
  push:
    tags: ["v*"]        # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:     # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app, zip and dmg
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev"; fi
          bash scripts/build_app.sh "$VERSION"

      - name: Keep build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vinyl
          path: dist/*.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
